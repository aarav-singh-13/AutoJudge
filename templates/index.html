<!DOCTYPE html>
<html>
<head>
    <title>AutoJudge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <h1>AutoJudge</h1>
    <p>Paste a programming problem below:</p>

    <form method="POST">
        <label>Problem Description</label><br>
        <textarea name="problem_text" required class="problem">{{ problem_text }}</textarea><br><br>

        <label>Input Description</label><br>
        <textarea name="input_text" required class="input">{{ input_text }}</textarea><br><br>

        <label>Output Description</label><br>
        <textarea name="output_text" required class="output">{{ output_text }}</textarea><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_class %}
        <div class="result">
            <p><strong>Predicted Difficulty:</strong> {{ prediction_class }}</p>
            <p><strong>Predicted Score:</strong> {{ prediction_score }}</p>
        </div>
    {% endif %}

</body>
</html>
